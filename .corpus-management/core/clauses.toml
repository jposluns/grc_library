# Clause register: the instructions transferred INTO the pack as sources of
# record. Each clause names its pack source (validated to exist) and its
# origin; the compiler fail-closes on a duplicate id or a dangling source.
schema_version = 1

[[clauses]]
id = "claude-generated-artefacts-note"
title = "Generated corpus artefacts are never hand-edited"
source = "core/policies/generated-artefacts-note.md"
origin = "grc_library .claude/CLAUDE.md, the Project section's generated-artefacts bullet (transferred verbatim in compile PR-2)"

[[clauses]]
id = "language-convention"
title = "Corpus language convention (Canadian-first English, -ize orthography, no em/en dashes)"
source = "core/rules/language-convention.md"
origin = "grc_library .claude/CLAUDE.md language-convention section (transferred in compile PR-3; heading raised h2 to standalone h1 with a blank line after, body otherwise verbatim; the CLAUDE.md section is now a pointer stub)"

[[clauses]]
id = "authoring-conventions"
title = "Corpus authoring conventions (mirror same-type document shape; citation accuracy and currency; linter-enforced prose style)"
source = "core/rules/authoring-conventions.md"
origin = "grc_library .claude/CLAUDE.md Conventions section (transferred in compile PR-4; heading raised h2 Conventions to standalone h1 Authoring conventions, body otherwise verbatim; the CLAUDE.md section is now a pointer stub)"

[[clauses]]
