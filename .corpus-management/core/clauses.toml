id = "claude-generated-artefacts-note"
title = "Generated corpus artefacts are never hand-edited"
source = "core/policies/generated-artefacts-note.md"
origin = "grc_library .claude/CLAUDE.md, the Project section's generated-artefacts bullet (transferred verbatim in compile PR-2)"

