entry_point = "tools/lint-bare-normative-shall.py"
origin = "grc_library tools/lint-bare-normative-shall.py, grc gate 56 (engine transferred in compile PR-9, check logic verbatim; the project tool became a thin Model-2 wrapper supplying the grc scan walk and the grc-specific exempt-file set)"

[[gates]]
id = "lint-links"
