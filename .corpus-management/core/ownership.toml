# Generated-output ownership register: one entry per gensrc.toml rule. This
# is the small, stable inventory OTHER gates read (gate 37 recognizes
# compiler-owned .claude/rules/ files from it) without needing the generation
# schema; the compiler fail-closes (exit 2) on any mismatch with the ruleset.
