# Profile register: reference-vocabulary profiles shipped under defaults/grc/.
#
# HAND-MAINTAINED SOURCE (like core/gates.toml): profiles are pack source the
# compiler VALIDATES at config-load time, never compiler-generated output, so
# no profile is an ownership.toml owned_target and gate 99 never owns its
# bytes (an adopter override lives outside the repo entirely). The compiler
# fail-closes (exit 2) on a malformed or duplicate entry, a dangling target, a
# target whose filename does not match its concern, an invalid profile file,
# or a defaults/grc/*.toml with no register row. Ids share the one
# clause / gate / hook / rule / profile namespace.
schema_version = 1

[[profiles]]
id = "citations"
concern = "citations"
target = "defaults/grc/citations.toml"
title = "Framework-citation denylist vocabulary (terms, reasons, replacements, per-term path exemptions)"
origin = "grc_library tools/lint-citations.py DENYLIST + PATH_EXEMPTIONS, transcribed verbatim in Phase-4 PR-A; the live gate-5 config since Phase-4 PR-B (the wrapper loads this profile via profile_loader and the literals were removed)"

[[profiles]]
id = "sections"
concern = "sections"
target = "defaults/grc/sections.toml"
title = "Required-sections-by-doctype vocabulary (orientation heading aliases, enforced doctypes)"
origin = "grc_library tools/lint-required-sections.py ORIENTATION_OPTIONS + REQUIRED_SECTIONS, transcribed verbatim in Phase-4 PR-C; the live gate-19 config since PR-C (the wrapper loads this profile via profile_loader and the literals were removed)"

[[profiles]]
id = "placement"
concern = "placement"
target = "defaults/grc/placement.toml"
title = "Section-placement rules (per-position, per-doctype section-order constraints)"
origin = "grc_library tools/lint-section-placement.py PLACEMENT_RULES, transcribed verbatim in Phase-4 PR-D; the live gate-38 config since PR-D (the wrapper loads this profile via profile_loader and the literal was removed)"

[[profiles]]
id = "alignment"
concern = "alignment"
target = "defaults/grc/alignment.toml"
title = "Filename/title alignment vocabulary (document-type prefix set + acronym/synonym map)"
origin = "grc_library tools/lint-filename-title-alignment.py DOCTYPES + SYNONYMS, transcribed verbatim in Phase-4 PR-E; the live gate-7 config since PR-E (the wrapper loads this profile via profile_loader, the literals were removed, and gate 67 reads the composed doctypes via _alignment_config())"
