# Verb prefixes (3b234 round 4): any run of them, with a hyphen after up to
# three of them, may precede an ise_stems entry inside the same word bounds, so a
# prefixed derivative needs no entry of its own (reorganised, unreorganised,
# de-emphasised). ASCII letters only; a word is only reported when a listed
# stem ends it, so premise, devise or comprise are never reported.
ise_prefixes = [
    "re",
    "un",
    "de",
    "mis",
    "over",
    "under",
    "pre",
    "dis",
    "co",
    "non",
