# Reference-vocabulary profile: placeholder-leakage markers (grc defaults).
#
# Concern: placeholders. The LIVE gate-12 configuration since Phase-4 PR-H:
# tools/lint-placeholder-leakage.py loads it via profile_loader.load("placeholders");
# the loader compiles each nested pattern={regex,ignorecase} table, and the engine
# (parameterized in PR-H) composes the (compiled-pattern, label) pairs. Values
# transcribed VERBATIM from the former engine PATTERNS. ORDER IS POLICY: scan reports
# the FIRST matching entry per line, so the array order determines the label. SEPARATE
# from gate 9 (shall-near-uncertainty) - the two share some marker tokens but keep
# distinct lists deliberately. The check ALGORITHM (scan, fence-skip) stays in the engine.
schema_version = 1

[[placeholders.patterns]]  # 0; flags=32
label = "TODO marker"
pattern = { regex = '\bTODO\b', ignorecase = false }

[[placeholders.patterns]]  # 1; flags=32
label = "TBD marker"
pattern = { regex = '\bTBD\b', ignorecase = false }

