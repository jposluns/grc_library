name: Repository quality checks

on:
  push:
    branches:
      - main
  pull_request:

# Least-privilege token: the lint job only reads the repository (checkout +
# run markdown/Python linters); it never writes contents, comments, or artefacts.
permissions:
  contents: read

jobs:
  # Gate 36 (the linter regression test suite) is sharded across the six
  # regression-shard jobs below (maintainer directive 2026-11-04). The
  # equivalence with one serial run holds in two parts: (1) the shards
  # together SELECT and run exactly the tests one serial run executes (each
  # shard recomputes the whole partition and fails closed on any selection
  # defect, and this job's gate-36 step verifies the same partition); and
  # (2) the serial runner's PER-MODULE refusal (a module with no credited
  # start fails the gate) is restored across shards by the summary job:
  # each shard publishes its per-module credited-start counts as its
  # `credited` job output, and the summary's reconcile step sums them and
  # fails when any module's total is zero. The summary job carries the
  # required-check name "Lint markdown corpus" and succeeds only when this
  # job and every shard succeeded AND that reconciliation passes, so the
  # merge guard's contract is unchanged.
  lint:
    name: Lint markdown corpus gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Metadata audit
        run: python3 .claude/skills/corpus-management/tools/lint-metadata.py

      # Gate 2 checks the whole root .working/CHANGELOG.md through its default scope.
      - name: Language and style audit
        run: python3 .claude/skills/corpus-management/tools/lint-language.py

      - name: Repository-internal link audit
        run: python3 .claude/skills/corpus-management/tools/lint-links.py

      - name: Structural index integrity audit
        run: python3 .claude/skills/corpus-management/tools/lint-structure.py

      - name: Framework citation hallucination audit
        run: python3 .claude/skills/corpus-management/tools/lint-citations.py

      - name: Standards-currency audit
        run: python3 .claude/skills/corpus-management/tools/lint-standards-currency.py

      - name: Filename and Document Title alignment audit
        run: python3 .claude/skills/corpus-management/tools/lint-filename-title-alignment.py

      - name: Owner and Approving Authority role audit
        run: python3 .claude/skills/corpus-management/tools/lint-roles.py

      - name: Mandatory requirement near uncertainty marker audit
        run: python3 .claude/skills/corpus-management/tools/lint-shall-near-uncertainty.py

      - name: Per-document review cadence audit
        run: python3 .claude/skills/corpus-management/tools/check-review-cadence.py

      - name: CHANGELOG file-reference link coverage
        run: python3 .claude/skills/corpus-management/tools/lint-changelog-link-coverage.py

      - name: Placeholder leakage audit
        run: python3 .claude/skills/corpus-management/tools/lint-placeholder-leakage.py

      - name: Library and document version monotonicity audit
        run: python3 .claude/skills/corpus-management/tools/lint-library-version-monotonicity.py

      - name: Metadata date format audit
        run: python3 .claude/skills/corpus-management/tools/lint-date-format.py

      - name: License consistency audit
        run: python3 .claude/skills/corpus-management/tools/lint-license-consistency.py

      - name: Stub document audit
        run: python3 .claude/skills/corpus-management/tools/lint-stub-documents.py

      - name: Section anchor reference audit
        run: python3 .claude/skills/corpus-management/tools/lint-section-anchors.py

      - name: Intra-document section reference audit
        run: python3 .claude/skills/corpus-management/tools/lint-intra-doc-refs.py

      - name: Required sections audit
        run: python3 .claude/skills/corpus-management/tools/lint-required-sections.py

      - name: Acronym expansion consistency audit
        run: python3 .claude/skills/corpus-management/tools/lint-acronym-consistency.py

      - name: Secret pattern audit
        run: python3 .claude/skills/corpus-management/tools/lint-secrets-in-content.py

      - name: PII pattern audit
        run: python3 .claude/skills/corpus-management/tools/lint-pii-in-content.py

      - name: Internal references audit
        run: python3 .claude/skills/corpus-management/tools/lint-internal-references.py

      - name: External link domain audit
        run: python3 .claude/skills/corpus-management/tools/lint-external-link-domains.py

      - name: Cross-document numerical coherence audit
        run: python3 .claude/skills/corpus-management/tools/lint-cross-doc-numbers.py

      - name: Orphan document audit
        run: python3 .claude/skills/corpus-management/tools/lint-orphan-documents.py

      - name: Citation verification freshness audit
        run: python3 .claude/skills/corpus-management/tools/lint-citation-verification-freshness.py

      - name: Tooling provenance freshness audit
        run: python3 .claude/skills/corpus-management/tools/lint-tooling-provenance-freshness.py

      - name: Version-date consistency audit
        run: python3 .claude/skills/corpus-management/tools/lint-version-date-consistency.py

      - name: Metadata-block line-break audit
        run: python3 .claude/skills/corpus-management/tools/lint-metadata-line-breaks.py

      - name: Document Date staleness audit
        run: python3 .claude/skills/corpus-management/tools/lint-document-date-staleness.py

      - name: Machine-readable taxonomy in sync
        run: python3 .claude/skills/corpus-management/tools/build-taxonomy.py --check

      - name: Adopter portal and maturity scorecard in sync
        run: python3 .claude/skills/corpus-management/tools/build-portal.py --check

      - name: Gate-name parity audit
        run: python3 .claude/skills/corpus-management/tools/lint-audit-gate-parity.py

      # Gate 36 in shard form: the suite itself runs in the six parallel
      # regression-shard jobs; this step proves their selection is an exact
      # partition of the discovered tests (a test no shard selects, a test
      # two shards select, or an empty shard refuses), without running them.
      - name: Linter regression test suite
        run: python3 .claude/skills/corpus-management/tools/run-linter-regression.py --verify-shards 6

      - name: Claude-rules local-copy sync audit
        run: python3 .claude/skills/corpus-management/tools/lint-claude-rules-sync.py

      - name: Section placement audit
        run: python3 .claude/skills/corpus-management/tools/lint-section-placement.py

      - name: Cross-file gate-count consistency audit
        run: python3 .claude/skills/corpus-management/tools/lint-gate-count-consistency.py

      - name: Corpus version-bump-recency audit
        run: python3 .claude/skills/corpus-management/tools/lint-version-bump-recency.py

      - name: Collection-enumeration consistency audit
        run: python3 .claude/skills/corpus-management/tools/lint-collection-enumeration-consistency.py

      - name: TODO staleness audit
        run: python3 .claude/skills/corpus-management/tools/lint-todo-staleness.py

      - name: Listing-surface completeness audit
        run: python3 .claude/skills/corpus-management/tools/lint-listing-surface-completeness.py

      - name: CSA CCM/AICM citation-accuracy audit
        run: python3 .claude/skills/corpus-management/tools/lint-ccm-aicm-citations.py

      - name: Matrix control-code validity audit
        run: python3 .claude/skills/corpus-management/tools/lint-matrix-control-codes.py

      - name: CCM provider-member range-direction audit
        run: python3 .claude/skills/corpus-management/tools/lint-ccm-provider-member-in-range.py

      - name: Directory-scan-scope parity audit
        run: python3 .claude/skills/corpus-management/tools/lint-scan-scope-parity.py

