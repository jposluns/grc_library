        run: python3 .claude/skills/corpus-management/tools/lint-bare-normative-shall.py

      - name: Backlog marked-done audit
        run: python3 .claude/skills/corpus-management/tools/lint-todo-marked-done.py

      - name: Per-document ISO Annex A validity audit
        run: python3 .claude/skills/corpus-management/tools/lint-document-iso-annex-a.py

      - name: CHANGELOG mirror header-parity audit
        run: python3 .claude/skills/corpus-management/tools/lint-changelog-mirror-header-parity.py

      - name: COBIT/ISO 31000 citation-existence audit
        run: python3 .claude/skills/corpus-management/tools/lint-cobit-iso31000-citations.py

      - name: Cross-file section-reference audit
        run: python3 .claude/skills/corpus-management/tools/lint-cross-file-section-refs.py

      - name: Audit-spec detailed-prose presence audit
        run: python3 .claude/skills/corpus-management/tools/lint-audit-spec-detailed-prose.py

      - name: Cross-file section-name audit
        run: python3 .claude/skills/corpus-management/tools/lint-cross-file-section-names.py

      - name: Unbalanced-fence audit
        run: python3 .claude/skills/corpus-management/tools/lint-unbalanced-fences.py

      - name: Document-Type enumeration parity audit
        run: python3 .claude/skills/corpus-management/tools/lint-doctype-parity.py

      - name: Nested-markdown-link audit
        run: python3 .claude/skills/corpus-management/tools/lint-nested-markdown-links.py

      - name: Positional backlog-token audit
        run: python3 .claude/skills/corpus-management/tools/lint-positional-backlog-tokens.py

      - name: Sibling-repo stub-guard audit
        run: python3 .claude/skills/corpus-management/tools/lint-sibling-placeholders.py

      - name: Stdlib-only import audit
        run: python3 .claude/skills/corpus-management/tools/lint-stdlib-only-imports.py

      - name: Citation-currency-cadence audit
        run: python3 .claude/skills/corpus-management/tools/lint-citation-currency-cadence.py

      - name: COBIT objective title-text audit
        run: python3 .claude/skills/corpus-management/tools/lint-cobit-title-text.py

      - name: Web-to-corpus link-target integrity audit
        run: python3 .claude/skills/corpus-management/tools/lint-web-corpus-links.py
      - name: Gate-name-citation inventory audit
        run: python3 .claude/skills/corpus-management/tools/lint-gate-citation-inventory.py
      - name: Backlog item-number permanence audit
        run: python3 .claude/skills/corpus-management/tools/lint-todo-number-permanence.py
      - name: NIST SSDF control-id validity audit
        run: python3 .claude/skills/corpus-management/tools/lint-ssdf-control-ids.py
      - name: Backlog list-tag audit
        run: python3 .claude/skills/corpus-management/tools/lint-todo-list-tag.py
      - name: Ungated-surface dash audit
        run: python3 .claude/skills/corpus-management/tools/lint-ungated-dashes.py
      - name: Narrative metadata audit
        run: python3 .claude/skills/corpus-management/tools/lint-narrative-metadata.py
      - name: Narrative registry sync
        run: python3 .claude/skills/corpus-management/tools/build-narrative-registry.py --check
      - name: Narrative boundary audit
        run: python3 .claude/skills/corpus-management/tools/lint-narrative-boundary.py
      - name: Narrative authority-boundary audit
        run: python3 .claude/skills/corpus-management/tools/lint-narrative-authority-boundary.py
      - name: Narrative vocabulary audit
        run: python3 .claude/skills/corpus-management/tools/lint-narrative-vocabulary.py
      - name: Narrative disclaimer-presence audit
        run: python3 .claude/skills/corpus-management/tools/lint-narrative-disclaimer.py
      - name: Backlog index-reference parity audit
        run: python3 .claude/skills/corpus-management/tools/lint-todo-index-reference-parity.py
      - name: .working/TODO.md number-allocation block sync
        run: python3 .claude/skills/corpus-management/tools/build-todo-number-allocation.py --check
      - name: Index-header parity audit
        run: python3 .claude/skills/corpus-management/tools/lint-index-header-parity.py --strict-owner

      - name: Relationship model in sync
        run: python3 .claude/skills/corpus-management/tools/build-relationship-model.py --check

      - name: Static unused-import audit
        run: python3 .claude/skills/corpus-management/tools/lint-unused-imports.py --enforce

      - name: Alignment-citation existence audit
        run: python3 .claude/skills/corpus-management/tools/lint-alignment-citation-existence.py --strict

      - name: Skill verdict carrier-completeness audit
        run: python3 .claude/skills/corpus-management/tools/lint-skill-verdict-carrier-completeness.py

      - name: AIQT vendor digest audit
        run: python3 .claude/skills/corpus-management/tools/lint-aiqt-vendor-digest.py

      - name: Corpus-management generated outputs in sync
        run: python3 .claude/skills/corpus-management/tools/build-corpus-management.py --check --release-delta

      - name: Allow-list and publisher-table parity audit
        run: python3 .claude/skills/corpus-management/tools/lint-allowlist-spec-parity.py

      - name: Citation-publisher table in sync with its source of record
        run: python3 .claude/skills/corpus-management/tools/build-citation-publishers.py --check

      - name: Reference-absence claim audit
        run: python3 .claude/skills/corpus-management/tools/lint-ref-absence-claims.py

      - name: Startup character and core-line ceiling audit
        run: python3 .claude/skills/corpus-management/tools/lint-startup-character-ceiling.py

      - name: Tooling backlog-reference audit
        run: python3 .claude/skills/corpus-management/tools/lint-tooling-backlog-refs.py

      - name: Table cell-count audit
        run: python3 .claude/skills/corpus-management/tools/lint-table-cell-count.py

      - name: Isolated-launch import audit
        run: python3 .claude/skills/corpus-management/tools/lint-isolated-launch.py

      - name: Baseline-pin integrity audit
        run: python3 .claude/skills/corpus-management/tools/lint-baseline-pin.py

      - name: Public hooks syntax and registration-parity audit
        run: python3 .claude/skills/corpus-management/tools/lint-hooks-syntax.py

      - name: CHANGELOG-on-PR check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-changelog-on-pr.py

      - name: Per-PR version-bump check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-version-bump-on-pr.py

      - name: CHANGELOG dash-on-PR check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-changelog-dash-on-pr.py

      - name: Per-PR Version-Date co-bump check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-date-cobump-on-pr.py

      - name: Backlog-rotation-on-PR check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-todo-rotation-on-pr.py

      - name: CHANGELOG length-on-PR check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-changelog-length-on-pr.py

      - name: Daily-changelog-rollup reminder
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-daily-changelog-rollup.py

      - name: Retired-section-orphan check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-retired-section-orphan-on-pr.py

      - name: CLAUDE.md-size ratchet
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-claude-md-size.py

      - name: Narrative-corpus mixed-diff check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-narrative-corpus-mixed-diff-on-pr.py

      - name: Number-floor monotonicity check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-todo-floor-monotonic-on-pr.py

      - name: Stranded-control-code check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-stranded-control-code-on-pr.py

      - name: Alignment-citation register check
        if: github.event_name == 'pull_request'
        run: python3 .claude/skills/corpus-management/tools/check-alignment-register-on-pr.py

  # Gate 36 shards. Each shard recomputes the whole deterministic selection
  # from .claude/skills/corpus-management/tests/regression-shard-weights.json and refuses unless it is an
  # exact partition of the discovered tests, then runs only its own slice,
  # so the six shards together run exactly the serial run's tests. Each
  # shard also publishes its per-module credited-start counts (validated
  # from the shard sentinel, written to GITHUB_OUTPUT as block-style
  # `module: count` lines) as its `credited` job output; the summary job
  # sums them across shards and fails when any module's total is zero,
  # matching the serial runner's per-module refusal. Each shard also
  # publishes `units_sha256` (the digest of the whole unit list its own
  # suite load found) and `selected_sha256` (that of its own units); the
  # summary fails unless every shard's `units_sha256` agrees, so a
  # discovery difference between runners fails the required check.
  regression-shard-1:
    name: Linter regression test suite (shard 1 of 6)
    runs-on: ubuntu-latest
    outputs:
      credited: ${{ steps.gate.outputs.credited }}
      units_sha256: ${{ steps.gate.outputs.units_sha256 }}
      selected_sha256: ${{ steps.gate.outputs.selected_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Linter regression test suite (shard 1 of 6)
        id: gate
        run: python3 .claude/skills/corpus-management/tools/run-linter-regression.py --shard 1/6

  regression-shard-2:
    name: Linter regression test suite (shard 2 of 6)
    runs-on: ubuntu-latest
    outputs:
      credited: ${{ steps.gate.outputs.credited }}
      units_sha256: ${{ steps.gate.outputs.units_sha256 }}
      selected_sha256: ${{ steps.gate.outputs.selected_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Linter regression test suite (shard 2 of 6)
        id: gate
        run: python3 .claude/skills/corpus-management/tools/run-linter-regression.py --shard 2/6

  regression-shard-3:
    name: Linter regression test suite (shard 3 of 6)
    runs-on: ubuntu-latest
    outputs:
      credited: ${{ steps.gate.outputs.credited }}
      units_sha256: ${{ steps.gate.outputs.units_sha256 }}
      selected_sha256: ${{ steps.gate.outputs.selected_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Linter regression test suite (shard 3 of 6)
        id: gate
        run: python3 .claude/skills/corpus-management/tools/run-linter-regression.py --shard 3/6

  regression-shard-4:
    name: Linter regression test suite (shard 4 of 6)
    runs-on: ubuntu-latest
    outputs:
      credited: ${{ steps.gate.outputs.credited }}
      units_sha256: ${{ steps.gate.outputs.units_sha256 }}
      selected_sha256: ${{ steps.gate.outputs.selected_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Linter regression test suite (shard 4 of 6)
        id: gate
        run: python3 .claude/skills/corpus-management/tools/run-linter-regression.py --shard 4/6

  regression-shard-5:
    name: Linter regression test suite (shard 5 of 6)
    runs-on: ubuntu-latest
    outputs:
      credited: ${{ steps.gate.outputs.credited }}
      units_sha256: ${{ steps.gate.outputs.units_sha256 }}
      selected_sha256: ${{ steps.gate.outputs.selected_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Linter regression test suite (shard 5 of 6)
        id: gate
        run: python3 .claude/skills/corpus-management/tools/run-linter-regression.py --shard 5/6

  regression-shard-6:
    name: Linter regression test suite (shard 6 of 6)
    runs-on: ubuntu-latest
    outputs:
      credited: ${{ steps.gate.outputs.credited }}
      units_sha256: ${{ steps.gate.outputs.units_sha256 }}
      selected_sha256: ${{ steps.gate.outputs.selected_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Linter regression test suite (shard 6 of 6)
        id: gate
        run: python3 .claude/skills/corpus-management/tools/run-linter-regression.py --shard 6/6

  # The required merge check (REQUIRED_CHECKS in the merge-when-green guard):
  # it succeeds only when the lint job and every regression shard succeeded
  # AND the shards' per-module credited-start counts, summed by the pinned
  # reconcile step, give every test module at least one credited start (the
  # serial runner's per-module refusal, restored across shards). if always()
  # keeps it running, and failing, when a needed job fails, is cancelled or
  # is skipped, so the merge guard sees a failed required check rather than
  # a missing one. The reconcile step fails closed on a missing, malformed
  # or wrongly-scoped shard output.
  summary:
    name: Lint markdown corpus
    runs-on: ubuntu-latest
    needs:
      - lint
      - regression-shard-1
      - regression-shard-2
      - regression-shard-3
      - regression-shard-4
      - regression-shard-5
      - regression-shard-6
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
