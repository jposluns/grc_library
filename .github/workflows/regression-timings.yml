name: Regression suite timing measurement

# Manual timing measurement, separate from the required quality checks.
on:
  workflow_dispatch:

# Least-privilege token: the job only reads the repository; the timing JSON
# leaves the runner as a workflow artefact, never as a commit.
permissions:
  contents: read

jobs:
  measure:
    name: Measure per-unit regression timings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: some regression tests read pinned blobs with
          # git show, as the quality workflow's checkout does.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install pinned dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Measure per-unit regression suite timings
        id: measurement
        run: |
          weights_dir="$(mktemp -d)"
          python3 .claude/skills/corpus-management/tools/measure-regression-timings.py --output "$weights_dir/regression-shard-weights.json"
          echo "weights=$weights_dir/regression-shard-weights.json" >> "$GITHUB_OUTPUT"

      # Publish only a fresh output from a successful measurement.
      - name: Upload shard-weights artefact
        if: ${{ success() && steps.measurement.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: regression-shard-weights
          path: ${{ steps.measurement.outputs.weights }}
          include-hidden-files: true
          if-no-files-found: error
