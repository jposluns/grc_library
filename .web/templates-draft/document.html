<!doctype html>
<html lang="en" class="site-grclibrary">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{DOC_TITLE}} | GRCLibrary.ai</title>
{{HEAD_STYLE}}
{{SCRIPT}}
</head>
<body>
<a class="skip" href="#main-content">Skip to content</a>
{{TOPBAR}}
<main id="main-content">
<div class="wrap"><div class="doc"><p class="lbl first">{{DOC_TYPE}}</p>
<h1>{{DOC_TITLE}}</h1>
{{DOC_RAIL}}
<p class="lead">{{DOC_LEAD}}</p>
<dl class="record side">
{{DOC_RECORD}}
</dl>
<p><a class="start" href="{{DOC_GITHUB_URL}}" target="_blank" rel="noopener noreferrer">Read the full text on GitHub <span class="arrow" aria-hidden="true">&rarr;</span><span class="vh"> (opens in a new tab)</span></a></p>
{{DOC_OUTLINE_SECTION}}
{{DOC_FRAMEWORKS_SECTION}}
{{DOC_RELATED_SECTION}}
<div class="next"><p class="lbl">Next</p><a class="start" href="{{BASE}}/documents/">All Documents <span class="arrow" aria-hidden="true">&rarr;</span></a></div></div></div>
</main>
{{FOOTER}}
<p class="vh" id="copy-status" role="status" aria-live="polite"></p>
</body>
</html>
