<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="description" content="Page not found: the requested page does not exist in the Governance, Risk, and Compliance Documentation Library.">
<title>Page not found: GRC Library</title>
{{HEAD_STYLE}}
</head>

<body>
<header class="mast">
  <div class="wrap">
{{TOPBAR}}
  </div>

  <div class="wrap hero">
    <p class="eyebrow reveal d1">404</p>
    <h1 class="reveal d2">Page <span class="accent">not&nbsp;found.</span></h1>
    <p class="dek reveal d3">
      The page you requested does not exist in the library. It may have moved when the
      corpus was reorganized, or the address may have been mistyped.
    </p>
    <div class="cta-row reveal d4">
      <a class="btn btn-primary" href="{{BASE}}/">Back to the library</a>
      <a class="btn btn-ghost" href="{{BASE}}/#register">Browse the domain register</a>
    </div>
  </div>
</header>

{{FOOTER}}

{{SCRIPT}}
</body>
</html>
