name: AIQT second opinion (Claude reviews Codex-authored change)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  # The vendor setup guide requires id-token: write so the action can fetch a
  # GitHub OIDC token on its default GitHub App authentication path.
  id-token: write

concurrency:
  group: aiqt-claude-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Models PIN per AIQT release; bump deliberately and record the bump.
  AIQT_CLAUDE_MODEL: claude-opus-5
  # The canonical brief, as installed on the DEFAULT branch (see the kit README).
  AIQT_BRIEF_PATH: .github/aiqt/aiqt-review.md

jobs:
  claude-second-opinion:
    # Fork guard (secrets never in scope for fork-origin code) AND the
    # cross-family filter (branch prefix or bot login marks a Codex-authored
    # change) AND the [skip aiqt] opt-out.
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip aiqt]') &&
      (startsWith(github.event.pull_request.head.ref, 'codex/') ||
       contains(fromJSON('["chatgpt-codex-connector[bot]"]'), github.event.pull_request.user.login))
    runs-on: ubuntu-latest
    steps:
      # PROMPT-INJECTION GUARD: the brief is staged from the DEFAULT branch,
      # never read from the pull-request head, so a PR cannot rewrite the
      # instructions a secret-bearing reviewer step consumes.
      - name: Fetch the canonical brief from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .aiqt-base
          sparse-checkout: |
            .github/aiqt

      - name: Stage the brief outside the workspace
        run: |
          install -m 0644 ".aiqt-base/${AIQT_BRIEF_PATH}" "${RUNNER_TEMP}/aiqt-brief.md"

      - name: Check out the pull-request revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Render the brief for this lane
        id: brief
        run: |
          {
            echo 'Lane header: this change was authored with a Codex-family assistant;'
            echo "you are the Claude-family check. Reviewer model pin: ${AIQT_CLAUDE_MODEL}."
            echo "Change id: pr-${PR_NUMBER}. Reviewed SHA: ${HEAD_SHA} (base ${BASE_SHA})."
            echo ''
            cat "${RUNNER_TEMP}/aiqt-brief.md"
          } > "${RUNNER_TEMP}/aiqt-claude-prompt.md"
          {
            echo 'content<<AIQT_BRIEF_EOF'
            cat "${RUNNER_TEMP}/aiqt-claude-prompt.md"
            echo 'AIQT_BRIEF_EOF'
          } >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Claude advisory review
        id: review
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1
        with:
          # Subscription OAuth at Level 2 (plan-included) when present; metered
          # API key otherwise. Verify precedence in the action's documentation
          # if both secrets are set.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          # The cross-family filter selects bot-authored PRs, so the selected
          # bot must be allowed to trigger the action.
          allowed_bots: chatgpt-codex-connector[bot]
          # ONE canonical brief (the kit's prompts/aiqt-review.md), staged from
          # the default branch above; this lane adds only its run-time header lines.
          prompt: ${{ steps.brief.outputs.content }}
          claude_args: |
            --max-turns 12 --model ${{ env.AIQT_CLAUDE_MODEL }}

      # A multi-path upload with if-no-files-found: error only fails when the
      # WHOLE set is empty, so the staged brief alone could mask an absent review
      # transcript. This step makes each required evidence file fail loud; the
      # upload below still runs on failure (if: always()) to persist what exists.
      - name: Fail loud on a partial evidence set
        if: always()
        run: |
          missing=0
          [ -s "${RUNNER_TEMP}/aiqt-claude-prompt.md" ] \
            || { echo "::error::rendered prompt missing from the evidence set"; missing=1; }
          if [ "${REVIEW_OUTCOME}" = "success" ] && [ ! -s "${EXECUTION_FILE}" ]; then
            echo "::error::review execution file missing though the review step succeeded"
            missing=1
          fi
          exit "$missing"
        env:
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          EXECUTION_FILE: ${{ steps.review.outputs.execution_file }}

      - name: Persist evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aiqt-claude-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            ${{ steps.review.outputs.execution_file }}
            ${{ runner.temp }}/claude-prompts/**
            ${{ runner.temp }}/aiqt-claude-prompt.md
          retention-days: 90
          if-no-files-found: error
