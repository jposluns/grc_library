- path: "governance/principle-capability-is-not-authority.md"
  domain: "governance"
  type: "Principle"
  title: "Capability Is Not Authority Principle"
  version: "0.0.3"
  date: "2026-08-30"
  owner: "Governance Library Maintainer"
  approving_authority: "Governance Library Maintainer"
  classification: "Public"
  category: "Core Governance"
  review_frequency: "Annual and upon material governance, AI, or regulatory change"
  license: "CC BY-SA 4.0"
  confidentiality: "Public"
  purpose: "This document states, in citable adopter-facing form, a foundational access-governance principle: capability is not authority. The technical ability to perform an action never, on its own, constitutes authorization to perform it. The principle names the recurring failure it forecloses, treating the existence of a means as permission to use it, and points at the corpus controls that already instantiate it. It is the access-governance counterpart to the library's principle-integrity-and-trustworthiness: where that principle governs the integrity of the work product, this one governs when an actor, human or automated, is permitted to act."
  related_documents:
    - "security/framework-zero-trust-architecture.md"
    - "ai/standard-ai-access-and-agent-permissions.md"
