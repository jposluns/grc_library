- path: "governance/principle-fail-closed-automation.md"
  domain: "governance"
  type: "Principle"
  title: "Fail-Closed Automation Principle"
  version: "0.0.1"
  date: "2026-08-30"
  owner: "Governance Library Maintainer"
  approving_authority: "Governance Library Maintainer"
  classification: "Public"
  category: "Core Governance"
  review_frequency: "Annual and upon material governance, AI, or regulatory change"
  license: "CC BY-SA 4.0"
  confidentiality: "Public"
  purpose: "This document states, in citable adopter-facing form, a foundational design principle for automated systems: automation fails closed. When an automated system encounters an error, an ambiguous input, or the loss of a condition its correct operation depends on, it enters a known, controlled, safe state rather than continuing into an unsafe or permissive one. The corpus already enforces this piecemeal (network default-deny, privacy-by-default, fail-closed handling of AI errors), but never states it as a principle a control can cite. This document makes it citable and generalizes it across every automated boundary."
  related_documents:
