  title: "Semantic Continuity in Migration and Retirement Standard"
  version: "0.0.2"
  date: "2026-08-31"
  owner: "GRC Programme Manager"
  approving_authority: "Governance Library Maintainer"
  classification: "Public"
  category: "Governance"
  review_frequency: "Annual and upon material change to migration, lifecycle, or retirement practice"
  license: "CC BY-SA 4.0"
  confidentiality: "Public"
  purpose: "When one thing replaces another, the organization tends to verify that the move was complete: the records transferred, the checksums match, the new system is readable and populated. Completeness answers whether the bits arrived; it does not answer whether the successor decides, classifies, or behaves as the predecessor did. A migration can be complete and lossless at the level of data and still change the meaning of the outputs: a re-mapped code list, a re-trained model, a replacement control that admits a different population. When the predecessor is then retired, that semantic change becomes invisible and irreversible."
  related_documents:
