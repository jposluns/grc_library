  license: "CC BY-SA 4.0"
  confidentiality: "Public"
  purpose: "An emergency lets a person, a system, or an AI agent exercise authority it would not ordinarily hold, to prevent or limit harm when the normal approval path is too slow. The corpus already carries domain-specific emergency paths (break-glass access, emergency change, emergency patch, crisis activation, incident containment, precautionary suspension), each with its own approver and its own after-the-fact review. What it does not carry is the general construct those paths share: what makes an emergency grant valid, how it is bounded, when it expires, what triggers an independent review of its continuation, and how its use is judged for proportionality after the fact."
