  license: "CC BY-SA 4.0"
  confidentiality: "Public"
  purpose: "Monitoring tells an organization what is happening in its systems, and every downstream security and operational decision rests on the assumption that the monitoring is working. That assumption is rarely governed as a whole. Individual controls in this library detect adverse events in monitored systems, and a few already watch specific monitoring sources for silence: a critical log source that stops feeding the security-information and event-management platform, a telemetry platform required to observe its own loss. What the library has lacked is a single standard that governs the integrity and coverage of monitoring across every domain and failure mode, so that those scoped operational checks sit under one accountable, risk-governed frame and the gaps between them are closed."
