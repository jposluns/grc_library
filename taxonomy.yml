  purpose: "This standard defines the delegation instrument: the recorded artefact by which a role holding an authority grants some part of it to another subject. The corpus provides typical, adjustable role authorities (governance/register-role-authority.md, whose column is \"Typical Approval Authority\") and refers to delegation only incidentally (\"or delegate\", \"CIO or delegate\"), with no standard for how a delegation is constituted, bounded, evidenced, sub-delegated, or revoked. This standard supplies that instrument, so a delegated authority is as governed as the authority it derives from."
