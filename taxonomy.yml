    - "security/standard-logging-and-monitoring.md"
    - "governance/principle-integrity-and-trustworthiness.md"
  sections:
    - "Purpose"
    - "Scope"
    - "1. The principle"
    - "2. The seven capability vectors"
    - "3. What creates authority: the authorization grant"
    - "4. Instantiation in the corpus"
    - "5. Adoption guidance"
    - "Framework alignment"
